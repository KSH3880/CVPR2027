env:
  numEnvs: 2048
  envSpacing: 5
  episodeLength: 600
  isFlagrun: false
  enableDebugVis: false
  cameraFollow: true
  video:
    enable: false
    focus: stack
  relationGraph:
    mode: edge_composition
    sampler: two_agent_mixed_carry_task_embedding
    semantic_only: true
    policy_task_roles: true
    max_edges_per_agent: 2
    edge_capacity: 4
    family_probabilities:
      joint_carry_at: 0.4
      joint_carry_ontop: 0.4
      independent: 0.2
    shuffle_edge_order: true
    shuffle_token_order: true
    coupling: same_carry_task_payload_target
  relationReward:
    mode: state_relation_edge_stage2_v1
    schema_version: 10
    stage1_variant: scenario_independent_stage1_unified_size_rsi_task_embedding
    state_reward_weight: 0.2
    progress_reward_weight: 0.2
    success_reward_weight: 0.2
    satisfaction_threshold: 0.9
    holding:
      hand_distance_scale: 10.0
    at:
      state_definition: box_near
      near_distance_scale: 10.0
    ontop:
      state_definition: centered_stack_world_z
      near_distance_scale: 10.0
      z_tolerance: 0.001
      vertical_extent: rotated_bbox
      success_inner_margin_fraction: 0.1
    sit:
      state_definition: box_top_plus_pelvis_clearance
      near_distance_scale: 10.0
      pelvis_clearance: 0.12
      success_inner_margin_fraction: 0.1
      z_tolerance: 0.07
    climb:
      state_definition: root_target
      near_distance_scale: 10.0
      target_height: rotated_bbox_top_plus_char_h
      success_inner_margin_fraction: 0.05
      root_height_tolerance: 0.2
      feet_height_tolerance: 0.07
    progress:
      kind: distance
      sigma: 1.0
      bbox_buffers:
        HOLDING: 0.2
        SIT: 0.3
        CLIMB: 0.3
        AT: 0.1
        ON_TOP: 0.1
    success:
      at_z_tolerance: 0.001
      saturation: none
      terminate_when_all_subgoals_done: false
    task_sharing:
      self: 1.0
      teammate: 0.0
    edge_aggregation: self_sum
    hard_skill_training:
      near_start:
        probability_start: 0.0
        probability_end: 0.0
        anneal_steps: 300000
        at_xy_range:
        - 0.75
        - 1.5
        ontop_xy_range:
        - 1.1
        - 1.8
      climb_rsi:
        late_fraction: 0.0
        phase_range:
        - 0.65
        - 0.98
    observation:
      graph_packet_fields:
      - valid
      - task
      - actor
      - payload
      - target
    diagnostics:
      enabled: true
      sample_envs: 2
      log_interval: 30
    joint_carry:
      anchor_inset: 0.15
      placement_gate: opposite_current_holding
      collision:
        mode: cpa
        ttc_discount: 0.99
        release_buffer: 1.0
      independent:
        environment_fraction: 0.2
        placement_gate: own_current_holding
        rsi: stage1_size_aware
