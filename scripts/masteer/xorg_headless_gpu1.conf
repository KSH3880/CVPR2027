Section "ServerLayout"
    Identifier "TokenHSIHeadlessGPU1"
    Screen 0 "TokenHSIScreenGPU1"
EndSection

Section "Device"
    Identifier "TokenHSIGPU1"
    Driver "nvidia"
    BusID "PCI:5:0:0"
    Option "AllowEmptyInitialConfiguration" "True"
    Option "UseDisplayDevice" "None"
EndSection

Section "Screen"
    Identifier "TokenHSIScreenGPU1"
    Device "TokenHSIGPU1"
    DefaultDepth 24
    SubSection "Display"
        Depth 24
        Virtual 1600 900
    EndSubSection
EndSection

Section "Extensions"
    Option "Composite" "Enable"
EndSection
