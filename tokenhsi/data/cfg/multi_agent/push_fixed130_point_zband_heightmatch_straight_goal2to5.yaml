env:
  openPushRandomizeLanes: true
  pushSceneRandomization:
    arena_center:
    - -4.0
    - 0.0
    arena_radius: 8.0
    min_station_distance: 12.0
    owner_loco_distance_range:
    - 1.0
    - 2.0
  pushContactPoint:
    height_range_m: [0.6175, 0.6175]
    rsi_clip_coverage: pd_survivors
  pushPointReward:
    height_band_m: [0.585, 0.650]
    z_reward_sigma_m: 0.04
  pushGoalContact: true
  pushGoalRandomization:
    sampling: box_forward_uniform
    distance_range:
    - 2.0
    - 5.0
  openPushRSI:
    bank_file: tokenhsi/data/push_fixed130_point_zband_heightmatch_straight_goal2to5_bank.json
    interaction_probability: 0.5
    late_probability: 0.7
    late_fraction: 0.3
    stand_off: 0.06
  numEnvs: 2048
  envSpacing: 20
  openPushLayout:
    push_x: -4.0
    lane_spacing: 10.0
  episodeLength: 600
  isFlagrun: false
  enableDebugVis: false
  cameraFollow: true
  video:
    enable: false
    focus: stack
  relationGraph:
    sampler: two_agent_open_push
    semantic_only: true
    shuffle_token_order: true
    task_probabilities:
      PUSH: 1.0
  relationReward:
    mode: state_relation_edge_stage1_v1
    schema_version: 12
    stage1_variant: stage1_open_push
    state_reward_weight: 0.4
    progress_reward_weight: 0.2
    success_reward_weight: 0.2
    task_sharing:
      self: 0.9
      teammate: 0.1
    success:
      saturation: current_success
      terminate_when_all_subgoals_done: false
    observation:
      graph_packet_fields:
      - valid
      - src
      - dst
      - relation
      - owner
    diagnostics:
      enabled: true
      sample_envs: 2
      log_interval: 30
    contact_at:
      near_distance_scale: 10.0
      satisfaction_threshold: 0.9
      z_tolerance: 0.001
      progress_delta: 0.5
      at_progress_delta: 0.1
      progress_sigma: 1.0
    push:
      contact_mode: fixed_face_surface
      target_distance: 2.0
      goal_tolerance: 0.15
      ground_tolerance: 0.08
      max_tilt: 0.35
      max_speed: 0.2
      max_angular_speed: 0.3
      hand_distance: 0.18
      hand_lateral_offset: 0.2
      hand_target_height: 0.8
      min_hand_force: 0.5
      min_box_force: 0.5
      min_contact_progress: 0.05
  numAgents: 2
  numObjects: 4
  agentSpawnRadius: 2.5
  policyObsMode: clean_scene
  obsFrame: owner
  agentCollisionPenalty: true
  agentCollisionCoeff: 0.5
  agentCollisionDist: 0.7
  pdControl: true
  powerScale: 1.0
  controlFrequencyInv: 2
  stateInit: Start
  hybridInitProb: 0.5
  numAMPObsSteps: 10
  localRootObs: true
  localRootObsPolicy: false
  rootHeightObs: false
  rootHeightObsPolicy: false
  cleanSceneLocalRootObsPolicy: true
  cleanSceneRootHeightObsPolicy: true
  keyBodies:
  - right_hand
  - left_hand
  - right_foot
  - left_foot
  contactBodies:
  - right_foot
  - left_foot
  terminationHeight: 0.15
  enableEarlyTermination: true
  enableSelfCollisionDetection: true
  enableTrackInitState: false
  power_reward: true
  power_coefficient: 0.0005
  skill:
  - loco
  - push
  skillInitProb:
  - 1.0
  - 0.0
  skillDiscProb:
  - 0.33
  - 0.67
  enableTaskObs: true
  onlyVelReward: true
  onlyHeightHandHeldReward: false
  box_vel_penalty: false
  box_vel_pen_coeff: 1.0
  box_vel_pen_threshold: 2.5
  mode: train
  box:
    build:
      baseSize: &id001
      - 1.3
      - 1.3
      - 1.3
      randomSize: false
      randomModeEqualProportion: false
      scaleRangeX:
      - 1.0
      - 1.0
      scaleRangeY:
      - 1.0
      - 1.0
      scaleRangeZ:
      - 0.75
      - 1.25
      scaleSampleInterval: 0.125
      randomDensity: false
      testSizes:
      - *id001
    reset:
      randomRot: false
      randomAssignment: false
      testRandomArenaSpawn: false
      arenaSpawnRadius: 0.0
      minAgentDistance: 1.0
      minBoxDistance: 0.7
      randomHeight: false
      randomHeightProb: 0.0
      groundStandaloneSitClimb: false
      minPlatformHeight: 0.05
      maxTopSurfaceHeight: 1.2
      ownerLocoDistanceRange:
      - 1.0
      - 2.0
    obs:
      enableBboxObs: true
  debug:
    vel: false
    reward: true
    rewardInterval: 30
  eval:
    successThreshold: 0.2
    skill:
    - loco
    skillInitProb:
    - 1.0
  asset:
    assetRoot: tokenhsi/data/assets
    assetFileName: mjcf/phys_humanoid_v3.xml
  plane:
    staticFriction: 1.0
    dynamicFriction: 1.0
    restitution: 0.0
  ampTaskConditioning: true
  goalRotation: identity
  ampExpertMapping:
    PUSH:
    - 0.33
    - 0.67
  ampEnabled: true
  pushBox:
    size: *id001
    mass: 20.0
    friction: 0.6
  pushOnly: true
sim:
  substeps: 2
  physx:
    num_threads: 4
    solver_type: 1
    num_position_iterations: 4
    num_velocity_iterations: 0
    contact_offset: 0.02
    rest_offset: 0.0
    bounce_threshold_velocity: 0.2
    max_depenetration_velocity: 10.0
    default_buffer_size_multiplier: 10.0
    contact_collection: 2
  flex:
    num_inner_iterations: 10
    warm_start: 0.25
