env:
  zoneAssignment:
    swap_probability: 0.5
  manipulationContact:
    body_force_threshold: 2.0
    body_distance_margin: 0.02
    open_credit_tolerance: 0.02
  openPushRSI:
    bank_file: tokenhsi/data/push_toy_random_at_10deg_at_tilt_soft_rsi_bank.json
    interaction_probability: 0.5
    late_probability: 0.7
    late_fraction: 0.3
    stand_off: 0.06
  numEnvs: 2048
  envSpacing: 7
  episodeLength: 600
  isFlagrun: false
  enableDebugVis: false
  cameraFollow: true
  video:
    enable: false
    focus: stack
  relationGraph:
    sampler: two_agent_open_push
    semantic_only: true
    shuffle_token_order: true
    task_probabilities:
      OPEN: 0.0
      PUSH: 1.0
    push_only: true
  relationReward:
    mode: state_relation_edge_stage1_v1
    schema_version: 12
    stage1_variant: stage1_open_push
    state_reward_weight: 0.2
    progress_reward_weight: 0.2
    success_reward_weight: 0.2
    door:
      target_angle: 1.5707963267948966
      angle_tolerance: 0.0
      hand_distance_scale: 10.0
      approach_delta: 0.5
      approach_sigma: 1.0
    task_sharing:
      self: 0.9
      teammate: 0.1
    success:
      saturation: paired_placement_current_success
      terminate_when_all_subgoals_done: false
    observation:
      graph_packet_fields:
      - valid
      - src
      - dst
      - relation
      - owner
    diagnostics:
      enabled: true
      sample_envs: 2
      log_interval: 30
    push:
      target_distance: 2.0
      goal_tolerance: 0.15
      ground_tolerance: 0.08
      max_tilt: 0.17453292519943295
      max_speed: 0.2
      max_angular_speed: 0.3
      hand_distance: 0.18
      hand_lateral_offset: 0.2
      hand_target_height: 0.8
      min_hand_force: 0.5
      min_box_force: 0.5
      min_contact_progress: 0.05
      control_mode: midpoint_xy_net_credit
    edge_aggregation: self_sum_teammate_mean
    satisfaction_threshold: 0.9
    at:
      near_distance_scale: 10.0
      z_tolerance: 0.001
      progress_delta: 0.1
      progress_sigma: 1.0
      tilt_shaping:
        full_angle: 0.08726646259971647
        zero_angle: 0.2617993877991494
        success_angle: 0.17453292519943295
    push_at:
      hand_reference: goal_opposite_surface_xy
      hand_distance_scale: 10.0
      approach_delta: 0.5
      approach_sigma: 1.0
      require_tilt: false
  numAgents: 2
  numObjects: 2
  agentSpawnRadius: 2.5
  policyObsMode: clean_scene
  obsFrame: owner
  agentCollisionPenalty: true
  agentCollisionCoeff: 0.5
  agentCollisionDist: 0.7
  pdControl: true
  powerScale: 1.0
  controlFrequencyInv: 2
  stateInit: Start
  hybridInitProb: 0.5
  numAMPObsSteps: 10
  localRootObs: true
  localRootObsPolicy: false
  rootHeightObs: false
  rootHeightObsPolicy: false
  cleanSceneLocalRootObsPolicy: true
  cleanSceneRootHeightObsPolicy: true
  keyBodies:
  - right_hand
  - left_hand
  - right_foot
  - left_foot
  contactBodies:
  - right_foot
  - left_foot
  terminationHeight: 0.15
  enableEarlyTermination: true
  enableSelfCollisionDetection: true
  enableTrackInitState: false
  power_reward: true
  power_coefficient: 0.0005
  skill:
  - loco
  - doorOpen
  - push
  skillInitProb:
  - 1.0
  - 0.0
  - 0.0
  skillDiscProb:
  - 0.33
  - 0.0
  - 0.67
  enableTaskObs: true
  onlyVelReward: true
  onlyHeightHandHeldReward: false
  box_vel_penalty: false
  box_vel_pen_coeff: 1.0
  box_vel_pen_threshold: 2.5
  mode: train
  box:
    build:
      baseSize: &id001
      - 1.3
      - 1.3
      - 1.3
      randomSize: false
      randomModeEqualProportion: false
      scaleRangeX:
      - 1.0
      - 1.0
      scaleRangeY:
      - 1.0
      - 1.0
      scaleRangeZ:
      - 0.75
      - 1.25
      scaleSampleInterval: 0.125
      randomDensity: false
      testSizes:
      - *id001
    reset:
      randomRot: true
      randomAssignment: true
      testRandomArenaSpawn: false
      arenaSpawnRadius: 0.0
      minAgentDistance: 1.0
      minBoxDistance: 0.7
      randomHeight: false
      randomHeightProb: 0.0
      groundStandaloneSitClimb: false
      minPlatformHeight: 0.05
      maxTopSurfaceHeight: 1.2
      ownerLocoDistanceRange:
      - 1.0
      - 2.0
    obs:
      enableBboxObs: true
  debug:
    vel: false
    reward: true
    rewardInterval: 30
  eval:
    successThreshold: 0.2
    skill:
    - loco
    skillInitProb:
    - 1.0
  asset:
    assetRoot: tokenhsi/data/assets
    assetFileName: mjcf/phys_humanoid_v3.xml
  plane:
    staticFriction: 1.0
    dynamicFriction: 1.0
    restitution: 0.0
  ampTaskConditioning: true
  goalRotation: identity
  door:
    resetAngleRange:
    - 0.0
    - 0.0
    autoClose:
      stiffness: 2.0
      damping: 0.5
      max_torque: 4.0
    hinge:
      damping: 0.5
      friction: 0.0
  ampExpertMapping:
    OPEN:
    - 0.33
    - 0.67
    - 0.0
    PUSH:
    - 0.33
    - 0.0
    - 0.67
  ampEnabled: true
  doorApproachAMP:
    gate_enabled: false
    full_distance: 1.2
    interaction_distance: 0.6
    hand_distance: 0.25
    angle_threshold: 0.05
    spawn_distance: 2.5
  doorHold:
    posture:
      min_pelvis_height_ratio: 0.7
      max_torso_tilt: 0.6981317007977318
      max_foot_height: 0.18
      min_foot_force: 1.0
    contact_grace: 0.1
    duration: 5.0
    hand_distance: 0.12
    min_hand_force: 0.5
    min_door_force: 0.5
  doorSpawnDistanceRange:
  - 1.5
  - 2.5
  pushBox:
    size: *id001
    mass: 20.0
    friction: 0.6
  pushScene:
    mode: owner_loco_random_at
    owner_anchor_xy:
    - - -4.0
      - -4.0
    - - -4.0
      - 4.0
    path_separation: 2.2
    random_at_goal:
      reach: 2.0
      min_distance: 1.0
      agent_clearance: 0.5
sim:
  substeps: 2
  physx:
    num_threads: 4
    solver_type: 1
    num_position_iterations: 4
    num_velocity_iterations: 0
    contact_offset: 0.02
    rest_offset: 0.0
    bounce_threshold_velocity: 0.2
    max_depenetration_velocity: 10.0
    default_buffer_size_multiplier: 10.0
    contact_collection: 2
  flex:
    num_inner_iterations: 10
    warm_start: 0.25
