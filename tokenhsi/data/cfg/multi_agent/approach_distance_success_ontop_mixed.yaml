# Mixed carry / independent OnTop / dependent OnTop training.
# See markdowns/ontop_mixed_config.md for input definitions and transfer behavior.
# All existing carry physics/reset/AMP settings below are copied unchanged.

experiment:
  name: ApproachDistanceSuccessOntopMixed
  output_path: output/approach_distance_success_ontop_mixed
  check_output_path: output/approach_distance_success_ontop_mixed_check
  train_config: tokenhsi/data/cfg/train/rlg/amp_ma_carry_relation.yaml
  motion_file: tokenhsi/data/dataset_carry/dataset_carry.yaml
  transfer:
    checkpoint: /home/hwanhee/ksh/approach_distance_success/output/approach_distance_success/ApproachDistanceSuccess_18-14-22-43/nn/ApproachDistanceSuccess_00018000.pth
    mode: compatible_weights_and_normalizers
    freeze: false
    restore_optimizer: false
    restore_counters: false
    restore_env_state: false
    relation_embedding:
      copy_existing_rows: true
      new_relations: [ontop]
      initialization: model_default
    # Both actor and critic must receive the existing rows plus a new OnTop row.
    require_transfer_report: true

env:
  numEnvs: 2048
  envSpacing: 5
  episodeLength: 600 # 20s
  isFlagrun: False
  enableDebugVis: False

  # Paid edge cap = 2 edges * (0.2 state + 0.2 progress) = 0.8.
  relationReward:
    mode: state_relation_ontop_mixed_v1
    schema_version: 1
    state_reward_weight: 0.2
    progress_reward_weight: 0.2
    subgoal_success_bonus: 0.0
    satisfaction_threshold: 0.9
    soft_gate: {beta: 30.0, center: 0.8}
    progress:
      kind: distance
      delta: 0.5 # metres: full progress inside this XY distance
      sigma: 1.0 # metres: reciprocal tail scale
    holding: {hand_distance_scale: 5.0}
    at:
      state_definition: box_near
      near_distance_scale: 10.0
    ontop:
      state_definition: surface_center_distance
      distance_scale: 10.0
      source_state: source_box_bottom_face_center
      target_state: support_box_top_face_center
      surface_offsets_frame: box_local_rotated_to_world
      progress_source: source_box_center
      progress_target: support_box_center
      # Local terminal geometry only; do not require the support owner's success.
      require_support_owner_current_success: false
    prerequisite:
      reduction: minimum
      state_timing: previous_step
      empty_value: 1.0
    success:
      # History follows each scenario graph and affects observations only.
      require_achieved_target_prerequisites: true
      require_current_target_prerequisites: false
      # Terminal At/OnTop phi >= 0.9 and |state source.z - target.z| <= 1 mm.
      # Existing local success payout overrides the owned edge gates.
      saturate_edge_rewards_while_current: true
      current_saturation_z_tolerance: 0.001
      current_success_reward: 0.2 # added every successful step; separate from edge saturation
      once_per_subgoal: true
      seed_achieved_from_valid_reset_state: true
      suppress_bonus_for_initial_success: true
      terminate_when_all_subgoals_done: false
    observation:
      include_relation_state: true
      include_subgoal_done: true
      relation_state_fields: [phi, gate, satisfied, achieved]
    diagnostics: {enabled: true, sample_envs: 2, log_interval: 30}

  # Fixed environment groups; physical-agent roles are shuffled at every reset.
  scenarioMixture:
    schedule: simultaneous_fixed
    assignment: fixed_env_groups
    role_assignment: random_per_episode
    role_assignment_fixed_within_episode: true
    reset_distribution: base_carry
    initialize_stacked: false
    # Ha/Hb are shuffled logical roles; Oa/Ob are their assigned movable boxes.
    # Ox is the remaining box; Ga/Gb are goal slots. Unused goal slots are masked.
    mask_unused_goals: true
    scenarios:
      - name: carry_carry
        num_envs: 512
        edges:
          - {id: holding_a, source: Ha, target: Oa, relation: holding, owner: a, prerequisites: []}
          - {id: at_a, source: Oa, target: Ga, relation: at, owner: a, prerequisites: [holding_a]}
          - {id: holding_b, source: Hb, target: Ob, relation: holding, owner: b, prerequisites: []}
          - {id: at_b, source: Ob, target: Gb, relation: at, owner: b, prerequisites: [holding_b]}
        terminal_edges: {a: at_a, b: at_b}
      - name: carry_ontop_independent
        num_envs: 768
        support: {node: Ox, fixed: true, resample_pose_on_reset: true}
        edges:
          - {id: holding_a, source: Ha, target: Oa, relation: holding, owner: a, prerequisites: []}
          - {id: at_a, source: Oa, target: Ga, relation: at, owner: a, prerequisites: [holding_a]}
          - {id: holding_b, source: Hb, target: Ob, relation: holding, owner: b, prerequisites: []}
          - {id: ontop_b, source: Ob, target: Ox, relation: ontop, owner: b, prerequisites: [holding_b]}
        terminal_edges: {a: at_a, b: ontop_b}
      - name: carry_ontop_dependent
        num_envs: 768
        edges:
          - {id: holding_a, source: Ha, target: Oa, relation: holding, owner: a, prerequisites: []}
          - {id: at_a, source: Oa, target: Ga, relation: at, owner: a, prerequisites: [holding_a]}
          - {id: holding_b, source: Hb, target: Ob, relation: holding, owner: b, prerequisites: []}
          - {id: ontop_b, source: Ob, target: Oa, relation: ontop, owner: b, prerequisites: [holding_b, at_a]}
        terminal_edges: {a: at_a, b: ontop_b}
    diagnostics:
      per_scenario: true
      dependent_first_ontop_success_at_distance: true
      dependent_final_joint_success: true
      dependent_joint_success_retention: true

  # ---- multi agent ----
  numAgents: 2
  numObjects: 3      # 0 => numAgents; otherwise must be >= numAgents
  agentSpawnRadius: 2.5 # agents start on a circle of this radius (ignored when numAgents == 1)

  # "clean_scene": one H/O/T node set (223/30/1) plus one 7-D GTA pose per token.
  #                H/O use type-wise RMS; T and env-local pose records bypass RMS.
  # "legacy_multirow": exact ego-first A1 baseline below, retained for ablations/checkpoints.
  policyObsMode: "clean_scene"  # "clean_scene" | "legacy_multirow"

  # "owner": every entity is described in the frame of the agent that owns it; a row is an
  #          ego-first permutation of the same M triplets, so M actions come out of one
  #          scene encoding and every token stays in the single-agent distribution.
  # "ego":   every entity re-expressed in the observing agent's frame (M x the transforms).
  obsFrame: "owner"   # legacy_multirow only: "owner" | "global" | "ego"

  agentCollisionPenalty: True
  agentCollisionCoeff: 0.5
  agentCollisionDist: 0.7

  pdControl: True
  powerScale: 1.0
  controlFrequencyInv: 2 # 30 Hz
  stateInit: "Random"
  hybridInitProb: 0.5
  numAMPObsSteps: 10

  localRootObs: True # amp disc obs
  localRootObsPolicy: False # legacy_multirow policy obs
  rootHeightObs: False # amp disc obs
  rootHeightObsPolicy: False # legacy_multirow policy obs
  cleanSceneLocalRootObsPolicy: True # GTA Human223 is fully heading-local
  cleanSceneRootHeightObsPolicy: True # GTA Human223 retains actual root height
  keyBodies: ["right_hand", "left_hand", "right_foot", "left_foot"]
  contactBodies: ["right_foot", "left_foot"]
  terminationHeight: 0.15
  enableEarlyTermination: True

  enableSelfCollisionDetection: True
  enableTrackInitState: False

  # power reward
  power_reward: True
  power_coefficient: 0.0005

  skill: ["omomo", "loco", "pickUp", "carryWith", "putDown"]
  skillInitProb: [0.0, 0.5, 0.1, 0.3, 0.1]
  skillDiscProb: [0.3, 0.3, 0.1, 0.1, 0.1]

  # task
  enableTaskObs: True
  onlyVelReward: True
  onlyHeightHandHeldReward: False

  box_vel_penalty: True # to avoid stiff grasping
  box_vel_pen_coeff: 1.0
  box_vel_pen_threshold: 2.5

  mode: "train"

  box:
    build:
      baseSize: [0.4, 0.4, 0.4] # unit: m
      randomSize: True
      randomModeEqualProportion: True
      scaleRangeX: [0.5, 1.5]
      scaleRangeY: [0.5, 1.5]
      scaleRangeZ: [0.5, 1.5]
      scaleSampleInterval: 0.125
      randomDensity: False # must stay False: the object token has a fixed width

      testSizes:
       - [0.22, 0.22, 0.22]
       - [0.27, 0.27, 0.27]
       - [0.32, 0.32, 0.32]
       - [0.37, 0.37, 0.37]
       - [0.42, 0.42, 0.42]
       - [0.47, 0.47, 0.47]
       - [0.52, 0.52, 0.52]
       - [0.57, 0.57, 0.57]
       - [0.30, 0.30, 0.40]

    reset:
      randomRot: True
      randomAssignment: True       # sample a distinct physical box for each agent every reset
      testRandomArenaSpawn: False  # --test: keep reference-aligned box resets by default
      arenaSpawnRadius: 0.0        # <= 0 => envSpacing - 0.5
      minAgentDistance: 1.0        # rejection sampling clearance at reset (metres)
      minBoxDistance: 0.7
      randomHeight: True
      randomHeightProb: 0.5
      minPlatformHeight: 0.05
      maxTopSurfaceHeight: 1.2

    obs:
      enableBboxObs: True

  debug:
      vel: False
      reward: True
      rewardInterval: 30

  eval:
    # override env settings
    successThreshold: 0.2
    skill: ["loco"]
    skillInitProb: [1.0]

  asset:
    assetRoot: "tokenhsi/data/assets"
    assetFileName: "mjcf/phys_humanoid_v3.xml"

  plane:
    staticFriction: 1.0
    dynamicFriction: 1.0
    restitution: 0.0

sim:
  substeps: 2
  physx:
    num_threads: 4
    solver_type: 1  # 0: pgs, 1: tgs
    num_position_iterations: 4
    num_velocity_iterations: 0
    contact_offset: 0.02
    rest_offset: 0.0
    bounce_threshold_velocity: 0.2
    max_depenetration_velocity: 10.0
    default_buffer_size_multiplier: 10.0

  flex:
    num_inner_iterations: 10
    warm_start: 0.25
