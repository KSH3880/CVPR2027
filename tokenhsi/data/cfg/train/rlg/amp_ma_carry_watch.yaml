# Watch-only variant of amp_ma_carry.yaml.
#
# rl_games requires  batch_size = horizon_length * num_envs * num_agents  to be a multiple
# of minibatch_size, and amp_minibatch_size <= minibatch_size. With num_envs=4 the batch is
# only 128 (M=1) or 256 (M=2), so the production batch sizes do not fit.
#
# This config exists purely to watch the characters move in a viewer. Four environments is
# far too little signal for the policy to actually improve -- use amp_ma_carry.yaml for
# real training.
params:
  seed: -1

  algo:
    name: ma

  model:
    name: amp

  network:
    name: amp_multi_agent
    separate: True

    transformer:
      num_features: 64
      tokenizer_units: [256, 128]
      num_layers: 4
      layer_num_heads: 2
      layer_dim_feedforward: 512
      extra_mlp_units: [1024, 512]

    space:
      continuous:
        mu_activation: None
        sigma_activation: None
        mu_init:
          name: default
        sigma_init:
          name: const_initializer
          val: -2.9
        fixed_sigma: True
        learn_sigma: False

    mlp:
      # critic only (the actor trunk is the transformer above)
      units: [1024, 512]
      activation: relu
      d2rl: False

      initializer:
        name: default
      regularizer:
        name: None

    disc:
      units: [1024, 512]
      activation: relu

      initializer:
        name: default

  load_checkpoint: False

  config:
    name: HumanoidMAWatch
    env_name: rlgpu
    multi_gpu: False
    ppo: True
    mixed_precision: False
    normalize_input: True # entity-wise, see learning/multi_agent/ma_agent.py
    normalize_value: True
    reward_shaper:
      scale_value: 1
    normalize_advantage: True
    gamma: 0.99
    tau: 0.95
    learning_rate: 2e-5
    lr_schedule: constant
    score_to_win: 20000
    max_epochs: 1000000
    save_best_after: 50
    save_frequency: 100000  # do not spam checkpoints while just watching
    save_intermediate: False
    print_stats: True
    grad_norm: 1.0
    entropy_coef: 0.0
    truncate_grads: False
    e_clip: 0.2
    horizon_length: 32
    minibatch_size: 128
    mini_epochs: 6
    critic_coef: 5
    clip_value: False
    seq_len: 4
    bounds_loss_coef: 10
    amp_obs_demo_buffer_size: 200000
    amp_replay_buffer_size: 200000
    amp_replay_keep_prob: 0.01
    amp_batch_size: 512
    amp_minibatch_size: 128
    disc_coef: 5
    disc_logit_reg: 0.01
    disc_grad_penalty: 5
    disc_reward_scale: 2
    disc_weight_decay: 0.0001
    normalize_amp_input: True
    enable_eps_greedy: False

    task_reward_w: 0.5
    disc_reward_w: 0.5
