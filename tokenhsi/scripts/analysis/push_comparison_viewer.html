$('save').onclick=()=>{const canvas=document.createElement('canvas'),w=views[0].renderer.domElement.width,h=views[0].renderer.domElement.height;canvas.width=w*views.length;canvas.height=h;const c=canvas.getContext('2d');views.forEach((v,i)=>{v.draw(currentFrame(v.which));c.drawImage(v.renderer.domElement,i*w,0)});const a=document.createElement('a');a.download=`seed${DATA.scenes[envKey].seed}_env${DATA.scenes[envKey].env}_${triple?'comparison':method}_step${Math.round(frame)}.png`;a.href=canvas.toDataURL('image/png');a.click()};
window.addEventListener('resize',()=>views.forEach(v=>v.resize()));window.addEventListener('keydown',e=>{if(e.target.tagName==='SELECT'||e.target.tagName==='INPUT')return;if(e.code==='Space'){e.preventDefault();$('play').click()}if(e.key==='ArrowRight'||e.key==='ArrowLeft'){playing=false;leavePhase();frame=Math.max(0,Math.min(900,frame+(e.key==='ArrowRight'?1:-1)));$('seek').value=frame}if(['1','2','3'].includes(e.key))document.querySelector(`[data-phase="${+e.key-1}"]`).click()});
function animate(now){const dt=Math.min((now-last)/1000,.15);last=now;if(playing){frame+=dt/DATA.dt*+$('speed').value;if(frame>=900){frame=900;playing=false}$('seek').value=Math.round(frame)}for(const v of views){v.draw(currentFrame(v.which));v.badge.textContent=NAMES[v.which]+` · ${(currentFrame(v.which)*DATA.dt).toFixed(2)}s`}$('clock').textContent=`${Math.round(frame)} / 900 · ${(frame*DATA.dt).toFixed(2)} s`;$('play').textContent=playing?'⏸ 일시정지':'▶ 재생';requestAnimationFrame(animate)}
$('seed').innerHTML=[...new Set(Object.values(DATA.scenes).map(sc=>sc.seed))].map(seed=>`<option value="${seed}">seed ${seed}</option>`).join('');if(DATA.reviewOnly){document.querySelector('[data-phase="1"]').textContent='② 선행 밀기 / 공동 접촉';document.querySelector('[data-phase="2"]').textContent='③ 이동 경로'}updateCaseControls();
try{rebuild();requestAnimationFrame(animate);window.PUSH_VIEWER={DATA,get state(){return{envKey,method,frame,triple,phaseMode}},selectMethod,rebuild}}catch(e){$('error').style.display='block';$('error').textContent='3D 초기화 오류: '+e.message+' · 브라우저의 하드웨어 가속을 확인해 주세요.';console.error(e)}
</script></body></html>
